# HTML 统一管理平台 - 生产部署编排
#
# 隔离核心：nginx-external 容器只挂载 ./data/public，
#           ./data/internal 与 ./data/dept 在该容器内不存在。
#           私有页面不是被规则拦截，而是文件根本不在外网容器里。

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmp}
      MYSQL_USER: ${MYSQL_USER:-hmp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 一次性任务：建表 / 结构同步。
  # 独立成 service 而不是在 deploy.sh 里 `compose run`，是为了让顺序由 compose 保证：
  # api 的 depends_on 会等它「成功退出」才启动，避免出现
  # 「api 先起来 → 表不存在 → 健康检查失败 → 重启循环」的窗口。
  api-migrate:
    image: hmp-api:${HMP_TAG:-local}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-hmp}
    command:
      - node
      - server/node_modules/prisma/build/index.js
      - db
      - push
      - --schema=server/prisma/schema.mysql.prisma
      - --skip-generate
    networks: [backend]

  api:
    image: hmp-api:${HMP_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_CONFIG_DIR: /app
      STORAGE_ROOT: /app/data
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-hmp}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CONTENT_TOKEN_SECRET: ${CONTENT_TOKEN_SECRET:?required}
      # 缺省 true（安全默认）；没有证书时在 deploy/.env 里显式写 false
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_EXTRACTED_BYTES: ${MAX_EXTRACTED_BYTES:-209715200}
      MAX_FILE_COUNT: ${MAX_FILE_COUNT:-500}
      MAX_SINGLE_FILE_BYTES: ${MAX_SINGLE_FILE_BYTES:-52428800}
      BUSINESS_TZ_OFFSET: ${BUSINESS_TZ_OFFSET:-480}
      RECYCLE_RETENTION_DAYS: ${RECYCLE_RETENTION_DAYS:-30}
    volumes:
      - ./data:/app/data
    networks: [backend]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/site').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  web-internal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        SITE: internal
    restart: unless-stopped
    depends_on: [api]
    ports:
      # 缺省失败关闭：不显式绑到内网网卡就只有本机能访问
      - "${INTERNAL_BIND:-127.0.0.1}:${INTERNAL_PORT:-80}:80"
    volumes:
      - ./data:/srv:ro
    networks: [backend, edge]

  web-external:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        SITE: external
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${EXTERNAL_BIND:-0.0.0.0}:${EXTERNAL_PORT:-8080}:80"
    volumes:
      - ./data/public:/srv:ro
    networks: [backend, edge]

  backup:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      BACKUP_DIR: /backups
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-hmp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmp}
      BACKUP_CRON: "${BACKUP_CRON:-17 3 * * *}"
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./data:/app/data:ro
      - ./data/_backups:/backups
      # 之前只写了 entrypoint 却没挂脚本，容器一起来就 "can't open /backup.sh"
      - ./backup.sh:/backup.sh:ro
    networks: [backend]
    command: ["cron"]
    entrypoint: ["/bin/sh", "/backup.sh"]

networks:
  backend:
    internal: false
  edge:

volumes:
  db-data: